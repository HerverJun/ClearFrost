name: ClearFrost V6 promotion gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-gate:
    runs-on: windows-latest

    steps:
      - name: Checkout candidate with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.419"

      - name: Assert .NET SDK identity
        shell: pwsh
        run: |
          $version = (& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^8\.\d+\.\d+$') {
              Write-Error "Expected an 8.x .NET SDK, got '$version'."
              exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Run promotion gate without release mutation
        id: gate
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .\tools\run_v6_gate.ps1 -Root $env:GITHUB_WORKSPACE -PromotionGate

      - name: Validate V6 evidence schema
        id: evidence-schema
        continue-on-error: true
        shell: pwsh
        run: .\tools\validate_v6_evidence.ps1 -EvidencePath (Join-Path $env:GITHUB_WORKSPACE "artifacts\v6-gate\evidence.json")

      - name: Enforce promotion decision
        if: always()
        shell: pwsh
        env:
          GATE_CONCLUSION: ${{ steps.gate.conclusion }}
          EVIDENCE_SCHEMA_CONCLUSION: ${{ steps.evidence-schema.conclusion }}
        run: |
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE "artifacts\v6-gate\evidence.json"
          if ($env:GATE_CONCLUSION -ne "success") {
              Write-Error "Promotion gate step failed: $env:GATE_CONCLUSION"
              exit 1
          }
          if ($env:EVIDENCE_SCHEMA_CONCLUSION -ne "success") {
              Write-Error "V6 evidence schema step failed: $env:EVIDENCE_SCHEMA_CONCLUSION"
              exit 1
          }
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
              Write-Error "Promotion evidence is missing: $evidencePath"
              exit 1
          }

          $evidence = Get-Content -LiteralPath $evidencePath -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "Development validation: $($evidence.developmentValidation.status)"
          Write-Host "Promotion eligibility: $($evidence.promotionEligibility)"
          if ($evidence.promotionEligibility -ne "PASS") {
              Write-Error "Promotion gate is BLOCKED. Required external production evidence is missing or invalid."
              exit 1
          }

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-promotion-evidence
          path: artifacts/v6-gate
          if-no-files-found: error
