name: ClearFrost V6 gate

on:
  push:
    branches:
      - V6_test
  pull_request:
    branches:
      - V6_test

permissions:
  contents: read

jobs:
  v6-gate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Run tracked-only fail-closed gate
        id: gate
        continue-on-error: true
        shell: pwsh
        run: .\tools\run_v6_gate.ps1 -Root $env:GITHUB_WORKSPACE

      - name: Enforce gate decision
        if: always()
        shell: pwsh
        run: |
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE "artifacts\v6-gate\evidence.json"
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
              Write-Error "V6 gate evidence is missing: $evidencePath"
              exit 1
          }

          $evidence = Get-Content -LiteralPath $evidencePath -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "Overall status: $($evidence.overallStatus)"
          Write-Host "Promotion eligibility: $($evidence.promotionEligibility)"
          if ($evidence.overallStatus -ne "PASS" -or $evidence.promotionEligibility -ne "PASS") {
              Write-Error "V6 promotion gate is not eligible. See uploaded evidence for blocking and not-verified reasons."
              exit 1
          }

      - name: Upload V6 gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-gate-evidence
          path: artifacts/v6-gate
          if-no-files-found: error
