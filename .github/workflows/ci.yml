name: ClearFrost V6 gate

on:
  push:
    branches:
      - V6_test
  pull_request:
    branches:
      - V6_test

permissions:
  contents: read

jobs:
  v6-gate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.419"

      - name: Assert .NET SDK identity
        shell: pwsh
        run: |
          $version = (& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^8\.\d+\.\d+$') {
              Write-Error "Expected an 8.x .NET SDK, got '$version'."
              exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Run tracked-only fail-closed gate
        id: gate
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .\tools\run_v6_gate.ps1 -Root $env:GITHUB_WORKSPACE

      - name: Validate V6 evidence schema
        id: evidence-schema
        continue-on-error: true
        shell: pwsh
        run: .\tools\validate_v6_evidence.ps1 -EvidencePath (Join-Path $env:GITHUB_WORKSPACE "artifacts\v6-gate\evidence.json")

      - name: Enforce development validation decision
        if: always()
        shell: pwsh
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          EVIDENCE_SCHEMA_OUTCOME: ${{ steps.evidence-schema.outcome }}
        run: |
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE "artifacts\v6-gate\evidence.json"
          if ($env:GATE_OUTCOME -ne "success") {
              Write-Error "V6 gate step failed: $env:GATE_OUTCOME"
              exit 1
          }
          if ($env:EVIDENCE_SCHEMA_OUTCOME -ne "success") {
              Write-Error "V6 evidence schema step failed: $env:EVIDENCE_SCHEMA_OUTCOME"
              exit 1
          }
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
              Write-Error "V6 gate evidence is missing: $evidencePath"
              exit 1
          }

          $evidence = Get-Content -LiteralPath $evidencePath -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "Development validation: $($evidence.developmentValidation.status)"
          Write-Host "Promotion eligibility: $($evidence.promotionEligibility)"
          if ($evidence.overallStatus -ne "PASS" -or $evidence.developmentValidation.status -ne "PASS") {
              Write-Error "V6 development validation failed. See uploaded evidence for blocking reasons."
              exit 1
          }
          if ($evidence.promotionEligibility -eq "BLOCKED") {
              Write-Host "Promotion remains BLOCKED because external production evidence is intentionally absent."
          }

      - name: Upload V6 gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-gate-evidence
          path: artifacts/v6-gate
          if-no-files-found: error
